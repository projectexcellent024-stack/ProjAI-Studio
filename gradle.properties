# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override settings here.

# Keep Gradle memory bounded while retaining enough heap for Android/KSP builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Safe for this single-module project and improves repeat-build performance.
org.gradle.configuration-cache=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official

# Use AndroidX libraries and enable resource-aware AndroidX tooling.
android.useAndroidX=true

# Suppress the legacy KSP1 warning; this project uses KSP2-compatible KSP tooling.
warn.on.ksp1.usage=false
